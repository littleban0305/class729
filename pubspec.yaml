name: class_729

description: 729 班級專用 Flutter 桌面軟體
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  window_manager: ^0.4.3
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  connectivity_plus: ^6.1.0
  puppeteer: ^3.26.0
  http: ^1.6.0
  package_info_plus: ^10.2.1
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Class729Rounded
      fonts:
        - asset: assets/300.otf
